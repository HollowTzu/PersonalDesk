name: Daily Market Desk Update

on:
  schedule:
    # Session-aligned runs, weekdays only. Times in UTC — fixed, does NOT
    # auto-adjust for US daylight saving. Current values assume EDT (UTC-4,
    # in effect Mar-Nov). Re-check these +/-1hr when US clocks change:
    #   Asia open   ~7:00 PM ET  -> 23:00 UTC
    #   London open ~3:00 AM ET  ->  7:00 UTC
    #   NY open     ~8:00 AM ET  -> 12:00 UTC
    - cron: '0 23 * * 1-5'   # Asia session
    - cron: '0 7 * * 1-5'    # London session
    - cron: '0 12 * * 1-5'   # New York session
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write   # <-- REQUIRED: default GITHUB_TOKEN is read-only on repos
                     # created after Feb 2023, so `git push` fails silently
                     # (job succeeds, commit exists locally, push is rejected)
                     # without this explicit grant.

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4

      - name: Run Dashboard Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "index.html"
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update Global Market Dashboard daily bias"
          git push
